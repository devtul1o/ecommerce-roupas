spring.application.name=ecommerce-roupas

# Carrega automaticamente as variaveis do arquivo .env na raiz do projeto
spring.config.import=optional:file:.env[.properties]

# Conexao com o PostgreSQL
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# Thymeleaf (desativa cache em dev para ver mudancas no HTML sem reiniciar)
spring.thymeleaf.cache=false

# Mercado Pago
mp.access-token=${MP_ACCESS_TOKEN}
app.base-url=${APP_BASE_URL}