<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meus Pedidos</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Meus Pedidos</h2>
        <a th:href="@{/}" class="btn btn-outline-secondary">Voltar à Vitrine</a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div th:if="${#lists.isEmpty(compras)}" class="alert alert-info">
        Você ainda não realizou nenhum pedido.
    </div>

    <div class="card shadow-sm mb-3 p-3" th:each="compra : ${compras}">
        <div class="d-flex justify-content-between">
            <h5>Pedido #<span th:text="${compra.codCompra}">1</span></h5>
            <span class="badge bg-primary fs-6" th:text="${compra.status}">STATUS</span>
        </div>
        <p class="mb-1">Total: <strong>R$ <span th:text="${#numbers.formatDecimal(compra.valorTotal, 1, 'POINT', 2, 'COMMA')}">0,00</span></strong></p>
        <p class="mb-0 text-muted" th:if="${compra.entrega != null}">
            Rastreio: <strong th:text="${compra.entrega.codigoRastreio}"></strong>
            (<span th:text="${compra.entrega.transportadora}"></span> - <span th:text="${compra.entrega.status}"></span>)
        </p>

        <div th:if="${compra.status.name() == 'AGUARDANDO_PAGAMENTO'}" class="mt-3 d-flex gap-2">
            <a th:href="@{/pedidos/{id}/pagar(id=${compra.codCompra})}" class="btn btn-sm btn-success">
                Pagar Agora
            </a>
            <form th:action="@{/pedidos/{id}/cancelar(id=${compra.codCompra})}" method="post" class="d-inline">
                <button type="submit" class="btn btn-sm btn-outline-danger">Cancelar Pedido</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
