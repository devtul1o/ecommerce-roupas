<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Painel Administrativo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-dark bg-dark mb-4">
    <div class="container">
        <span class="navbar-brand">Painel Administrativo</span>
        <div class="d-flex align-items-center gap-3">
            <span class="text-light">Olá, <strong th:text="${primeiroNome}">Admin</strong>!</span>
            <a th:href="@{/}" class="btn btn-outline-light btn-sm">Ver Vitrine</a>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-danger btn-sm">Sair</button>
            </form>
        </div>
    </div>
</nav>

<div class="container pb-5">
    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="row g-4 mb-4">
        <!-- Cadastrar Categoria -->
        <div class="col-md-4">
            <div class="card shadow-sm p-3 h-100">
                <h5>1. Nova Categoria</h5>
                <form th:action="@{/admin/categorias}" method="post">
                    <div class="mb-2">
                        <input type="text" name="nome" class="form-control" placeholder="Ex: Calças" required>
                    </div>
                    <div class="mb-3">
                        <input type="text" name="descricao" class="form-control" placeholder="Descrição da categoria" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Salvar Categoria</button>
                </form>
            </div>
        </div>

        <!-- Cadastrar Produto -->
        <div class="col-md-4">
            <div class="card shadow-sm p-3 h-100">
                <h5>2. Novo Produto</h5>
                <form th:action="@{/admin/produtos}" method="post">
                    <div class="mb-2"><input type="text" name="nome" class="form-control" placeholder="Nome do produto" required></div>
                    <div class="mb-2"><input type="text" name="descricao" class="form-control" placeholder="Descrição" required></div>
                    <div class="mb-2"><input type="text" name="marca" class="form-control" placeholder="Marca (ex: Levi's)" required></div>
                    <div class="mb-2"><input type="text" name="imagem" class="form-control" placeholder="URL da imagem" required></div>
                    <div class="mb-2"><input type="number" step="0.01" name="preco" class="form-control" placeholder="Preço (ex: 79.90)" required></div>
                    <div class="mb-3">
                        <select name="codCategoria" class="form-select">
                            <option value="">Sem categoria</option>
                            <option th:each="cat : ${categorias}" th:value="${cat.codCategoria}" th:text="${cat.nome}"></option>
                        </select>
                    </div>
                    <button type="submit" class="btn btn-success w-100">Salvar Produto</button>
                </form>
            </div>
        </div>

        <!-- Adicionar Variação -->
        <div class="col-md-4">
            <div class="card shadow-sm p-3 h-100">
                <h5>3. Adicionar Variação</h5>
                <form th:action="@{/admin/variacoes}" method="post">
                    <div class="mb-2">
                        <select name="codProduto" class="form-select" required>
                            <option th:each="p : ${produtos}" th:value="${p.codProduto}" th:text="${p.nome}"></option>
                        </select>
                    </div>
                    <div class="mb-2"><input type="text" name="tamanho" class="form-control" placeholder="Tamanho (P, M, G)" required></div>
                    <div class="mb-2"><input type="text" name="cor" class="form-control" placeholder="Cor (Preto, Azul)" required></div>
                    <div class="mb-3"><input type="number" name="estoque" class="form-control" placeholder="Estoque" min="0" required></div>
                    <button type="submit" class="btn btn-dark w-100">Adicionar Variação</button>
                </form>
            </div>
        </div>
    </div>

    <!-- Gerenciar Pedidos e Entregas -->
    <div class="card shadow-sm p-4">
        <h5 class="mb-3">4. Pedidos e Entregas</h5>
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Pedido</th>
                    <th>Cliente</th>
                    <th>Total</th>
                    <th>Status Compra</th>
                    <th>Entrega</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="compra : ${compras}">
                    <td>#<span th:text="${compra.codCompra}">1</span></td>
                    <td th:text="${compra.cliente.nomeCompleto}">Cliente</td>
                    <td>R$ <span th:text="${#numbers.formatDecimal(compra.valorTotal, 1, 'POINT', 2, 'COMMA')}">0,00</span></td>
                    <td><span class="badge bg-info text-dark" th:text="${compra.status}">STATUS</span></td>
                    <td>
                        <!-- Se ainda não tem entrega -->
                        <form th:if="${compra.entrega == null}" th:action="@{/admin/entregas}" method="post" class="d-flex gap-1">
                            <input type="hidden" name="codCompra" th:value="${compra.codCompra}">
                            <input type="text" name="codigoRastreio" class="form-control form-control-sm" placeholder="Rastreio" required>
                            <input type="text" name="transportadora" class="form-control form-control-sm" placeholder="Transportadora" required>
                            <input type="date" name="dataPrevista" class="form-control form-control-sm" required>
                            <button type="submit" class="btn btn-sm btn-primary">Postar</button>
                        </form>

                        <!-- Se já tem entrega -->
                        <form th:if="${compra.entrega != null}" th:action="@{/admin/entregas/status}" method="post" class="d-flex gap-1 align-items-center">
                            <input type="hidden" name="codigoRastreio" th:value="${compra.entrega.codigoRastreio}">
                            <span class="small me-1" th:text="${compra.entrega.codigoRastreio}"></span>
                            <select name="status" class="form-select form-select-sm" style="width: auto;">
                                <option th:each="st : ${statusEntregas}" th:value="${st}" th:text="${st}"
                                        th:selected="${st == compra.entrega.status}"></option>
                            </select>
                            <button type="submit" class="btn btn-sm btn-outline-success">Atualizar</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>
    </div>
</div>
</body>
</html>
