<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Entrar - Loja de Roupas</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light d-flex align-items-center min-vh-100">
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-5 col-lg-4">
            <div class="card shadow-sm p-4">
                <h3 class="text-center mb-1">Entrar</h3>
                <p class="text-center text-muted mb-4">Acesse sua conta para continuar</p>

                <div th:if="${param.error}" class="alert alert-danger py-2 text-center">
                    E-mail ou senha inválidos.
                </div>

                <div th:if="${param.logout}" class="alert alert-success py-2 text-center">
                    Você saiu da sua conta com sucesso.
                </div>

                <div th:if="${sucesso}" class="alert alert-success py-2 text-center" th:text="${sucesso}"></div>

                <form th:action="@{/login}" method="post">
                    <div class="mb-3">
                        <label for="username" class="form-label">E-mail</label>
                        <input id="username" type="email" name="username" class="form-control"
                               placeholder="seu@email.com" required autofocus>
                    </div>

                    <div class="mb-3">
                        <label for="password" class="form-label">Senha</label>
                        <input id="password" type="password" name="password" class="form-control"
                               placeholder="Sua senha" required>
                    </div>

                    <button type="submit" class="btn btn-dark w-100 mb-3">Entrar</button>
                </form>

                <div class="text-center small">
                    <p class="mb-1">
                        Ainda não tem conta?
                        <a th:href="@{/cadastro}" class="text-decoration-none fw-semibold">Cadastre-se</a>
                    </p>
                    <a th:href="@{/}" class="text-muted text-decoration-none">Voltar para a loja</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
