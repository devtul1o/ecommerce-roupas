<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Loja de Roupas - Vitrine</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">Loja de Roupas</a>
        <div class="d-flex align-items-center gap-2">
            <!-- Quando estiver logado -->
            <th:block th:if="${primeiroNome != null}">
                <span class="text-light d-flex align-items-center gap-1 me-2">
                    <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" fill="currentColor" viewBox="0 0 16 16">
                        <path d="M8 8a3 3 0 1 0 0-6 3 3 0 0 0 0 6m2-3a2 2 0 1 1-4 0 2 2 0 0 1 4 0m4 8c0 1-1 1-1 1H3s-1 0-1-1 1-4 6-4 6 3 6 4m-1-.004c-.001-.246-.154-.986-.832-1.664C11.516 10.68 10.289 10 8 10s-3.516.68-4.168 1.332c-.678.678-.83 1.418-.832 1.664z"/>
                    </svg>
                    <span>Olá, <strong th:text="${primeiroNome}">Usuário</strong>!</span>
                </span>
                <a class="btn btn-outline-light btn-sm" th:href="@{/carrinho}">Carrinho</a>
                <a class="btn btn-outline-light btn-sm" th:href="@{/meus-pedidos}">Meus Pedidos</a>
                <form th:action="@{/logout}" method="post" class="m-0">
                    <button type="submit" class="btn btn-outline-danger btn-sm">Sair</button>
                </form>
            </th:block>

            <!-- Quando NÃO estiver logado -->
            <th:block th:if="${primeiroNome == null}">
                <a class="btn btn-primary btn-sm" th:href="@{/login}">Entrar</a>
                <a class="btn btn-success btn-sm" th:href="@{/cadastro}">Cadastrar</a>
            </th:block>
        </div>
    </div>
</nav>

<div class="container">
    <form th:action="@{/catalogo}" method="get" class="row g-2 mb-4">
        <div class="col-md-10">
            <input type="text" name="busca" class="form-control" placeholder="Buscar produto pelo nome...">
        </div>
        <div class="col-md-2">
            <button type="submit" class="btn btn-dark w-100">Buscar</button>
        </div>
    </form>

    <div class="mb-4">
        <a th:href="@{/}" class="btn btn-sm btn-outline-secondary me-1">Todas</a>
        <a th:each="cat : ${categorias}"
           th:href="@{/catalogo(categoria=${cat.codCategoria})}"
           th:text="${cat.nome}"
           class="btn btn-sm btn-outline-secondary me-1"></a>
    </div>

    <div th:if="${#lists.isEmpty(produtos)}" class="alert alert-info">
        Nenhum produto encontrado no catálogo.
    </div>

    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="produto : ${produtos}">
            <div class="card h-100 shadow-sm">
                <img th:src="${produto.imagem}"
                    class="card-img-top"
                    alt="Foto do produto"
                    style="height: 220px; object-fit: cover;">
                <div class="card-body">
                    <h5 class="card-title" th:text="${produto.nome}">Nome do Produto</h5>
                    <p class="card-text text-muted" th:text="${produto.descricao}">Descrição</p>
                    <p class="fw-bold fs-5">R$ <span th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">0,00</span></p>
                </div>
                <div class="card-footer bg-white border-0">
                    <a th:href="@{/produto/{id}(id=${produto.codProduto})}" class="btn btn-dark w-100">Ver Detalhes</a>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
