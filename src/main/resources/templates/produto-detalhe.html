<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title th:text="${produto.nome}">Detalhes do Produto</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <a th:href="@{/}" class="btn btn-outline-secondary mb-3">&larr; Voltar para a vitrine</a>

    <div class="card shadow-sm p-4">
    <div class="row g-4 align-items-center">
        <div class="col-md-5 text-center">
            <img th:src="${produto.imagem}"
                 th:alt="${produto.nome}"
                 class="img-fluid rounded"
                 style="max-height: 450px; width: 100%; object-fit: contain;">
        </div>

        <div class="col-md-7">
            <h2 th:text="${produto.nome}">Nome</h2>
            <p class="text-muted" th:text="${produto.descricao}">Descrição</p>
            <h4 class="text-success mb-4">
                R$ <span th:text="${#numbers.formatDecimal(produto.preco, 1, 'POINT', 2, 'COMMA')}">0,00</span>
            </h4>

            <form th:action="@{/carrinho/adicionar}" method="post">
                <div class="mb-3">
                    <label class="form-label">Escolha Tamanho / Cor:</label>
                    <select name="codVariacao" class="form-select" required>
                        <option th:each="v : ${produto.variacoes}"
                                th:value="${v.codVariacao}"
                                th:text="${v.tamanho + ' - ' + v.cor + ' (Estoque: ' + v.estoque + ')'}">
                        </option>
                    </select>
                </div>
                <div class="mb-3" style="max-width: 150px;">
                    <label class="form-label">Quantidade:</label>
                    <input type="number" name="quantidade" value="1" min="1" class="form-control" required>
                </div>
                <button type="submit" class="btn btn-primary">Adicionar ao Carrinho</button>
            </form>
        </div>
    </div>
</div>
</div>
</body>
</html>
