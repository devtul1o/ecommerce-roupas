<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Meu Carrinho</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2>Meu Carrinho</h2>
        <a th:href="@{/}" class="btn btn-outline-secondary">Continuar Comprando</a>
    </div>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div th:if="${#lists.isEmpty(carrinho.itens)}" class="alert alert-info">
        Seu carrinho está vazio.
    </div>

    <div th:unless="${#lists.isEmpty(carrinho.itens)}" class="card shadow-sm p-3">
        <table class="table align-middle">
            <thead>
                <tr>
                    <th>Produto</th>
                    <th>Variação</th>
                    <th>Preço Unit.</th>
                    <th>Qtd</th>
                    <th>Ação</th>
                </tr>
            </thead>
            <tbody>
                <tr th:each="item : ${carrinho.itens}">
                    <td th:text="${item.variacao.produto.nome}">Produto</td>
                    <td th:text="${item.variacao.tamanho + ' / ' + item.variacao.cor}">M / Preto</td>
                    <td>R$ <span th:text="${#numbers.formatDecimal(item.variacao.produto.preco, 1, 'POINT', 2, 'COMMA')}">0,00</span></td>
                    <td th:text="${item.quantidade}">1</td>
                    <td>
                        <form th:action="@{/carrinho/remover}" method="post">
                            <input type="hidden" name="codVariacao" th:value="${item.variacao.codVariacao}">
                            <button type="submit" class="btn btn-sm btn-danger">Remover</button>
                        </form>
                    </td>
                </tr>
            </tbody>
        </table>

        <div class="d-flex justify-content-between align-items-center mt-3">
            <h4>Total: R$ <span th:text="${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}">0,00</span></h4>
            <a th:href="@{/checkout}" class="btn btn-success btn-lg">Ir para Checkout</a>
        </div>
    </div>
</div>
</body>
</html>
