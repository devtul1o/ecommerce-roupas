<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <title>Finalizar Compra</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-4">
    <h2 class="mb-3">Finalizar Compra</h2>

    <div th:if="${sucesso}" class="alert alert-success" th:text="${sucesso}"></div>
    <div th:if="${erro}" class="alert alert-danger" th:text="${erro}"></div>

    <div class="row g-4">
        <div class="col-md-7">
            <div class="card shadow-sm p-4 mb-4">
                <h5>1. Dados do Pedido</h5>
                <p class="fs-5">Total: <strong>R$ <span th:text="${#numbers.formatDecimal(total, 1, 'POINT', 2, 'COMMA')}">0,00</span></strong></p>

                <form th:action="@{/checkout/finalizar}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Endereço de Entrega</label>
                        <select name="codEndereco" class="form-select" required>
                            <option th:each="e : ${enderecos}"
                                    th:value="${e.codEndereco}"
                                    th:text="${e.logradouro + ', ' + e.numero + (e.complemento != null and !e.complemento.isBlank() ? ' (' + e.complemento + ')' : '') + ' - ' + e.cidade + '/' + e.estado}">
                            </option>
                        </select>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Método de Pagamento</label>
                        <select id="metodoPagamento" name="metodoPagamento" class="form-select" required>
                            <option th:each="m : ${metodos}" th:value="${m}" th:text="${m}"></option>
                        </select>
                    </div>

                    <div class="mb-3" style="max-width: 180px;">
                        <label class="form-label">Parcelas</label>
                        <input id="numeroParcelas" type="number" name="numeroParcelas" value="1" min="1" max="12" class="form-control">
                    </div>

                    <button type="submit" class="btn btn-success w-100" th:disabled="${#lists.isEmpty(enderecos)}">
                        Confirmar Pedido
                    </button>
                </form>
            </div>
        </div>

        <div class="col-md-5">
            <div class="card shadow-sm p-4">
                <h5>Cadastrar Novo Endereço</h5>
                <form th:action="@{/checkout/endereco}" method="post">
                    <div class="mb-2">
                        <input id="cep" type="text" name="cep" class="form-control" placeholder="CEP (somente números)" maxlength="9" required>
                    </div>
                    <div class="mb-2">
                        <input id="logradouro" type="text" name="logradouro" class="form-control" placeholder="Rua / Avenida" required>
                    </div>
                    <div class="mb-2">
                        <input id="numero" type="text" name="numero" class="form-control" placeholder="Número" required>
                    </div>
                    <div class="mb-2">
                        <input id="complemento" type="text" name="complemento" class="form-control" placeholder="Complemento (opcional)">
                    </div>
                    <div class="mb-2">
                        <input id="bairro" type="text" name="bairro" class="form-control" placeholder="Bairro" required>
                    </div>
                    <div class="mb-2">
                        <input id="cidade" type="text" name="cidade" class="form-control" placeholder="Cidade" required>
                    </div>
                    <div class="mb-3">
                        <input id="estado" type="text" name="estado" class="form-control" placeholder="UF (ex: PE)" maxlength="2" required>
                    </div>
                    <button type="submit" class="btn btn-outline-primary w-100">Salvar Endereço</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script>
    // 1. Bloquear parcelas para PIX, Débito e Boleto (libera apenas Crédito)
    const metodoSelect = document.getElementById('metodoPagamento');
    const parcelasInput = document.getElementById('numeroParcelas');

    function atualizarParcelas() {
        const metodo = metodoSelect.value.toUpperCase();
        if (metodo.includes('CREDITO')) {
            parcelasInput.disabled = false;
        } else {
            parcelasInput.value = 1;
            parcelasInput.disabled = true;
        }
    }

    metodoSelect.addEventListener('change', atualizarParcelas);
    atualizarParcelas(); // executa ao carregar a página

    // 2. Busca automática de endereço pelo CEP (ViaCEP)
    const cepInput = document.getElementById('cep');

    cepInput.addEventListener('input', async () => {
        const cepLimpo = cepInput.value.replace(/\D/g, '');
        if (cepLimpo.length !== 8) return;

        try {
            const response = await fetch(`https://viacep.com.br/ws/${cepLimpo}/json/`);
            const dados = await response.json();

            if (!dados.erro) {
                document.getElementById('logradouro').value = dados.logradouro || '';
                document.getElementById('bairro').value = dados.bairro || '';
                document.getElementById('cidade').value = dados.localidade || '';
                document.getElementById('estado').value = dados.uf || '';
                document.getElementById('numero').focus();
            }
        } catch (e) {
            console.error('Erro ao consultar ViaCEP:', e);
        }
    });
</script>
</body>
</html>
